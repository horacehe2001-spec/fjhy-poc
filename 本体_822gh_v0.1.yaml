      cond: 付款总金额>=30万
      note: 模板 1《费用报销审批流程1》
    - from: P09
      to: P10
      cond: 付款总金额<30万
      note: 模板 1《费用报销审批流程1》、2《费用报销审批流程2》、3《费用报销审批流程3》
    - from: P09
      to: P10
      cond: 付款金额>10万【是否三重一大】选了是 / 付款总金额>=30万
      note: 模板 2《费用报销审批流程2》
    - from: P09
      to: P10
      cond: 付款金额<=10万
      note: 模板 2《费用报销审批流程2》
    - from: P09
      to: P10
      cond: 付款金额>=5000万，【是否三重一大】选了是
      note: 模板 3《费用报销审批流程3》
    - from: P09
      to: P10
      cond: 付款金额<5000万 / 付款总金额>=30万
      note: 模板 3《费用报销审批流程3》

