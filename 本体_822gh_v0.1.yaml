# ============================================================================
# 822港航 本体 v0.1
# ----------------------------------------------------------------------------
# 【这份文件现在是什么】
#   业务侧仍是脚手架（1 个实体 + 12 个概念 + 7 个枚举，对应 29 张真实单据的列）；
#   **流程侧已经是建模成果**（10 个节点 / 56 条迁移 / 25 条绑定，2026-10-31 补），
#   来源是客户已填好的《附件6：审批流程收集确认表》，不是设计出来的。
#
#   真正的 822港航 实体与关系要从这个实例自己那 539 条条款里建，
#   那是一次建模，不是搬运。现在没有的部分**就是没有**，
#   不拿 福建海运集团 的本体顶替——那份 YAML 的 meta.entity 写着「财智分公司」，
#   rank_to_tier 的 subject 也全是它的组织名，装进来会以另一家的口径
#   定义实体和概念，而页面上看不出来。
#
# 【为什么需要有这份文件】
#   迁移 0044 把本体链按实例隔离了（ontology_* 九表 + enum_value_current
#   全部带 instance_id，24 条枚举外键改成三列组合外键）。
#   起因是 822港航 的住宿费档位名不在共用枚举里，317 条限额写不进去：
#       standard_limit.tier_enum 是 GENERATED ALWAYS AS ('EN21')（迁移 0008），
#       FOREIGN KEY (tier_enum, tier) REFERENCES enum_value_current(...)
#   那道闸是对的——它防的是「现编一个档位名」。所以解法不是绕过它，
#   是让每个实例有自己的枚举。
#
# 【改这份文件之后要做什么】
#   本体工场 → ②装载本体源文件（或 python -I -m app.ontology.loader）。
#   YAML 是源，库里是投影，**单向，永不回写**。
# ============================================================================
meta:
  version: '0.1'
  maturity: draft
  date: 2026-10-31
  scenario: 差旅费报账单
  entity: 福建省港航建设发展有限公司
  scope_note: |
    建到什么程度（2026-10-31 实测，不是估的）：
      实体    1 个（E01 报账单，脚手架）
      概念    21 个（对应 29 张真实单据导出表的列 + 招待明细区 9 项）
      枚举    7 个（EN01/02/03/04/12/15/21）
      关系    0 条  —— **还没做**
      流程    10 个节点 / 56 条迁移 / 25 条单据类型绑定
              出自《附件6：审批流程收集确认表》，客户已填好，见 process 一节

    这一行原来写的是「实体/概念/关系/流程尚未建模」。流程那一半**已经不对了**：
    建流程本体要的材料一直在手上，是我方没读那份确认表。
    关系仍然是 0 条，那个是真没做。

business:
  entities:
    # ════════════════════════════════════════════════════════════════════════
    # 2026-11-01：实体从「脚手架 1 个」改成 10 个，并补上 11 条关系。
    #
    # 【怎么划的】**按库里真有数据的表划，不按制度条款划。**
    # 每个实体下面的 rows 是实测行数，可以用 SQL 数出来；
    # 概念只收**实际有值的列**（可得性三档里的「有」和「部分」），
    # 全空的列不立概念——立了就是一个看起来建好了、实际取不到值的格子，
    # 而规则会以为自己能读到它。
    #
    # 为什么不从 343 条条款建：那是另一件事，而且是一次建模不是搬运。
    # 骨架先立在能验证的数据上，条款那条路等骨架稳了再补。
    # 现在凭条款划出来的实体，十有八九又是一个脚手架。
    #
    # 【实体编号与福建海运集团对齐】
    # 同一样东西用同一个号（E03 两边都是出差审批单），便于两家对照、
    # 也便于规则绑定时不用做一层翻译。822港航 独有的从 E18 起编，
    # 不占它已经用掉的 E01~E17。
    #
    # 【福建海运集团有、而 822港航 **没有建**的 6 个实体，逐个说明原因】
    #   E06 住宿费发票    hotel_invoice 0 行——住宿发票混在 invoice 里，
    #                    没有单独的住宿明细表（间夜、房型、入住人）
    #   E07 交通费凭证    transport_voucher 0 行——车次席别现在只在
    #                    invoice.detail_text 的文本里，没有结构化
    #   E11 预算         budget 0 行——客户未提供预算额度
    #   E14 事权审批单    本实例未见此类单据
    #   E16 费用分摊      expense_allocation 0 行——分摊区读进了 E02 的
    #                    alloc_dept，没有独立的分摊实体
    #   E17 直管企业特殊规则 要不要这一类，待业务确认（已列进客户清单）
    # **写出来是为了让「没建」和「漏了」分得开。**
    #
    # 【E12 / E15 已经建了——这段清单一度落后于事实，顺手订正】
    #   2026-11-01 之前这里写着「E12 审批记录 approval_record 0 行」和
    #   「E15 会议培训通知 全是扫描件、未结构化」，而那时候两张表都已经
    #   有数据、实体也已经建在下面了。**「没建」清单落后于事实比没有清单更坏**：
    #   它会让人以为复核过了。两条现在的真实状态：
    #     E12 审批记录    16 行，全部是**业务接待审批**那条流程的；
    #                    报账单自己的审批流水客户仍然没给
    #     E15 会议培训通知 6 行（1 份文字层 + 5 份读图）
    # ════════════════════════════════════════════════════════════════════════
    - id: E01
      name: 报账单
      source: 822港航 报账单导出（差旅 20 张 + 招待 9 张）
      rows: 29
      note: |
        共享系统的报账单主表。差旅与招待共用本实体，以 doc_type 区分
        （EN01：差旅费报账单 / 业务招待费报账单）。
        **日常费用报销单那 53 张不在这里**：客户只给了附件压缩包、
        没给数据表，所以它们一张都没进系统（已列进客户清单）。
      concepts:
        - id: C03
          name: 单据号
          type: string
          source: 报账单导出 · 主表区/头表区「单据号」
        - id: C04
          name: 单据类型
          type: string
          enum: EN01
          source: 按导出文件来源判定（导出表里没有这一列）
        - id: C05
          name: 单据状态
          type: string
          enum: EN02
          source: 由「驳回原因」非空推出（导出表里没有状态列）
        - id: C06
          name: 业务大类
          type: string
          enum: EN03
          source: 报账单导出 · 主表区/头表区「业务大类」
          note: |
            EN03 记的是**这 29 张单上实际出现过的 4 个值**。
            客户一共分多少类，在参照表「业务大类对照表」里（16 类）——
            两者不要混用：判「这张单的大类合不合法」用对照表，
            判「本实例有哪些业务」用 EN03。
        - id: C08
          name: 报销金额
          type: number
          source: 报账单导出 · 主表区/头表区「报销金额」
        - id: C09
          name: 经办部门
          type: string
          source: 报账单导出 · 主表区/头表区「经办部门」
        - id: C10
          name: 事由
          type: string
          source: 报账单导出 · 主表区/头表区「事由」
        - id: C11
          name: 驳回原因
          type: string
          source: 报账单导出 · 主表区/头表区「驳回原因」
          note: |
            **人工复核的真实结论**，29 张全部非空。
            这是本实例目前唯一的人工判定来源，入库进 manual_review。
        - id: C12
          name: 出差地点
          type: string
          source: 差旅报账单导出 · 工作表「出差地点」
          note: 整单一个地点（如「宁德、福州」），**不是逐日的**。逐日地点仍缺。
        - id: C22
          name: 入账期间
          type: string
          source: 报账单导出「入账期间」，精确到月
          note: |
            **没有单据日期**。客户 29 条驳回意见里有 8 条是「入账期间填错」，
            而判这个要有一个业务发生日期做基准——目前唯一的业务日期是
            E18 的招待发生日期（只覆盖 9 张招待单）。已列进客户清单。
        - id: C23
          name: 费用归属部门
          type: string
          source: 报账单导出 · 归属区/费用归属区「费用归属部门」（29/29 有值）
        - id: C24
          name: 收款人
          type: string
          source: 报账单导出 · 支付区「收款客商」（28/29 有值）
          note: |
            一张单（FJPG-BX2607280255）有两个收款人，字段留空、原值记进 remark
            ——**不挑一行当代表**。
            「收款账户名称」那一列**没有入库**：payee_account 在福建海运集团
            装的是银行卡号，822港航 给的是账户名，同一列两种语义。
        - id: C25
          name: 支付方式
          type: string
          source: 报账单导出 · 支付区「支付方式」（29/29，全是「网银转账」）
        - id: C26
          name: 付款用途
          type: string
          source: 报账单导出 · 支付区「付款用途」（29/29 有值）

    - id: E02
      name: 费用明细
      source: 报账单导出 · 分摊区/费用分摊区（**整行去重后**）
      rows: 70
      note: |
        报账单的费用明细行。
        **源文件里每一行都重复了一遍**：差旅那份分摊区 118 行去重后 61 行。
        判据不是「看着像重复」，是**去重后明细合计正好等于报销金额**——
        29 张单里去重后对得上的有 29 张，不去重只有 1 张。
        不去重的代价是实打实的：市内交通费 160 被算成 320，
        而 2 天的包干上限是 160，规则会报「超标一倍」而单据完全合规。
        第一次跑引擎就这样误报了 4 条。
        这里原来写 rows: 136（去重前的数），被
        tests/test_onto_822gh_entities.py 的「声称必须等于实际」那条用例抓出来。
        **「市内交通费补贴」和「市内交通补贴」是两种写法**，客户系统里就这样，
        没有合并——合并是口径决策，不是清洗。
      concepts:
        - id: C07
          name: 费用小类
          type: string
          enum: EN04
          source: 分摊区/费用分摊区「业务小类」
        - id: C27
          name: 明细金额
          type: number
          source: 分摊区「金额」（136/136 有值）
        - id: C28
          name: 责任部门
          type: string
          source: 分摊区「责任部门」（136/136 有值）
        - id: C01
          name: 住宿费
          type: number
          source: 办法第九条「住宿费是指公司工作人员因公出差期间入住宾馆发生的房租费用」
          note: 费用小类「住宿费」那一类明细的金额，实测 25 行。

    - id: E03
      name: 出差审批单
      source: 单据附件里的出差审批单（15 份 PDF 文字层 + 7 份读图）
      rows: 22
      note: |
        **两种来源，可信度不同，用 trip_application.extracted_from 分**：
          审批单文字层 15 行——表头、逐日用餐/用车小表、出差人签名日期全有
          审批单读图    7 行——2026-11-01 读图批
        这个区分不是记账用的，是规则必须看的：TR-通用-02 判的正是
        「逐日表填满没有」和「签名日期有没有」。
        **但判据不是这一列，是 trip_application.detail_read**（migration 0062）：
        来源说「从哪来」，覆盖面说「抽了哪几块」，两件事。
        第三轮读图只问了表头三个字段，规则按空值报「缺 N 天」，
        **一次造出 6 条误报**（命中从 4 跳到 10）——「没读」不是「没填」。
        第四轮把逐日表和签名日期补进提示词（21 行逐日入库），
        按 detail_read 判之后判不了的从 6 降到 2。
        **8 行变 7 行是重读的结果**：有一份第二次读的把握降到「低」，
        低把握不回写，那一行没了（它两次读出的出差年份都和报账单差两年）。
      concepts:
        - id: C29
          name: 审批单号
          type: string
          source: PDF 文件名里的 OA 流程实例号（15/15 有值）
        - id: C30
          name: 出差起止日期
          type: date
          source: 审批单「出差起止时间」（15/15）
        - id: C31
          name: 出差天数
          type: number
          source: 审批单「出差天数」（15/15）
        - id: C32
          name: 出差人数
          type: number
          source: 审批单「人数」（15/15）
        - id: C33
          name: 出差事由
          type: string
          source: 审批单「出差事由」（15/15）
        - id: C34
          name: 审批日期
          type: date
          source: 审批单右上角的审批日期（15/15，每份 3 个时间戳取最后一个）
          note: |
            **这是「出差审批」那条流程的时间，不是报账单审批流程的。**
            报账单那条流程的流水客户未提供，别混为一谈。
        - id: C35
          name: 填报日期
          type: date
          source: 审批单「填报日期」（15/15）
          note: |
            这一格的标签排在值**后面**（按坐标重建后值先出现），
            按「标签—值」取会 0/15。第一版就是这样，而审批日期碰巧对了
            ——碰巧对的那一半最容易让人以为整块都对。
        - id: C36
          name: 用餐情况
          type: string
          enum: EN05
          source: 审批单「差旅用餐情况」小表的汇总（13/15 取到单一值）
          note: 逐日明细在 E04；本格只在全日全餐次取值一致时才给，否则留空。
        - id: C37
          name: 用车情况
          type: string
          enum: EN06
          source: 审批单「差旅用车情况」小表的汇总（11/15）

    - id: E04
      name: 出差日历
      source: 出差审批单里的「差旅用餐情况」「差旅用车情况」两张小表（文字层 90 + 读图 21）
      rows: 111
      note: |
        逐日逐餐次一行（37 个日子 × 早/中/晚）。
        **2026-11-01 第四轮从 90 行到 111 行**：读图的提示词补上了这两张
        小表，5 份扫描件/手写勾选表读出 7 个日子。手写表的日期格不写年份
        （「4 月 29 日」），按表头出差起止的年份补；补不出年份的整行丢掉，
        而且**丢了就不算「读过」**——丢完还说读过，规则会按剩下的行
        报「缺 N 天」，那是误报。
        **2026-11-01 第三轮从 87 行到 90 行**：原来只按用餐段的日期铺，
        某天只填了用车、没填用餐，这一天就整天不入库——
        判「逐日表覆盖了出差区间几天」时会算成「两样都没填」，
        比实际严重，报告上多报一天。改成按用餐段与用车段日期的**并集**铺。
        **口径是装载程序定的**（库里原来一行都没有，福建海运集团那边
        trip_calendar 是空表，没有现成约定可抄）：
          has_meal = 该餐不是「自行用餐（含免费）」，即接待单位安排了
          has_car  = 该日用车格里出现过「自行用车」以外的取值
        实测 24 行是接待单位安排的餐、9 天是接待单位提供车辆。
        这两个事实正是伙食补助与市内交通费规则要比的东西。
      concepts:
        - id: C38
          name: 日期
          type: date
          source: 用餐/用车小表的日期列（87/87）
        - id: C39
          name: 餐次
          type: string
          enum: EN08
          source: 用餐小表的列头（早/中/晚）
        - id: C40
          name: 是否接待单位安排用餐
          type: boolean
          source: 由用餐格取值推出（87/87 有值，其中 24 行为是）
        - id: C41
          name: 是否接待单位提供车辆
          type: boolean
          source: 由用车格取值推出（87/87 有值，其中 9 天为是）
        - id: C42
          name: 逐日地点
          type: string
          source: 「**没有**」——审批单上只有整单一个出差地点
          note: |
            **这个概念立出来是为了让缺口可见。** 库里 trip_calendar.place
            87 行全空。没有它就判不了「在途每天按哪个目的地的标准计补助」。
            已列进客户清单。立一个取不到值的概念是例外，
            理由是规则确实要它、而且它是客户侧缺口的锚点。

    - id: E05
      name: 发票
      source: 单据附件里的电子发票 PDF（文字层按坐标重建，零模型）
      rows: 53
      note: |
        实测 3 种票面：数电普票、数电专票、铁路电子客票（29 张）。
        **另有 182 张 JPG 票据未解析**，所以这 53 张不是本实例发票的全集——
        拿它去判「附件里的票是否都录进了明细」会反向误判。
      concepts:
        - id: C43
          name: 发票号码
          type: string
          source: 票面「发票号码」（53/53）
        - id: C44
          name: 发票类型
          type: string
          enum: EN09
          source: 票面标题经一次口径映射（见 EN09 的注释）
        - id: C45
          name: 开票日期
          type: date
          source: 票面「开票日期」（53/53）
        - id: C46
          name: 购买方名称
          type: string
          source: 票面「购买方名称」（53/53）
        - id: C47
          name: 销售方名称
          type: string
          source: 票面「销售方名称」（24/53）
          note: 铁路电子客票票面**本来就不写销售方**，空着不是解析漏了。
        - id: C48
          name: 价税合计
          type: number
          source: 票面「价税合计（小写）」或票价（50/53）
        - id: C49
          name: 税额
          type: number
          source: 票面「税额」（21/53）
          note: 铁路电子客票没有税额栏，空着不是漏了。
        - id: C50
          name: 项目明细
          type: string
          source: 票面「项目名称」那一行（53/53）
          note: |
            形如「*住宿服务*住宿费 天 1 330.19 6% 19.81」。
            判「有没有烟酒礼品类目」靠它。火车票取的是车次席别那一行，
            **不取乘车人那一行**——那一行有身份证号和姓名。

    - id: E08
      name: 出差人
      source: 822港航 员工信息导出(2026-10-27)，49 人全量
      rows: 50
      note: |
        49 人来自员工导出（真工号 + 部门 + 主岗），另 1 人只在单据上出现过、
        员工导出里查不到（雒朔），用占位工号挂住、职级留空。
        **差旅级别那一列没有入库**：49 人全是「二级」，而住宿标准表有三档，
        对不上——这是要客户先解释的口径问题，映射没定之前入库就是在猜。
      concepts:
        - id: C51
          name: 工号
          type: string
          source: 员工导出「员工工号」（50/50）
        - id: C52
          name: 姓名
          type: string
          source: 员工导出「员工姓名」（50/50）
        - id: C53
          name: 部门
          type: string
          source: 员工导出「部门」（50/50，11 个部门）
        - id: C54
          name: 职级
          type: string
          enum: EN12
          source: 员工导出「主岗」（49/50）
          note: |
            取的是**主岗**不是差旅级别，两列是两回事，见 EN12 的注释。
            **主岗与交通工具等级档位对不上**：等级表写「公司正职领导／
            其他人员」，主岗写「董事长／副总经理／部门负责人／员工／其他员工」。
            两个「其他人员」是不是同一群人，要客户确认。

    - id: E09
      name: 核算主体
      source: 本体 meta.entity + 12 份制度文件的抬头
      rows: 1
      note: |
        **只有一个，就是本实例那家公司。** 导出表里的「经办部门」是部门
        不是法人主体，不能当核算主体——12 个部门在参照表「部门数据表」里。
      concepts:
        - id: C55
          name: 主体名称
          type: string
          source: 福建省港航建设发展有限公司
        - id: C56
          name: 是否内部单位
          type: boolean
          source: 本实例自身，恒为是

    - id: E10
      name: 标准表
      source: 822港航 自己的制度条款 + 住宿费标准明细表
      rows: 321
      note: |
        住宿费限额 317 条（附件1 标准明细表）+ 伙食补助费 3 条 + 市内交通费 1 条
        （均抽自 闽港发资财〔2026〕3 号 第十四/十七条，新旧两版逐条对过）。
        **交通工具等级标准不在这张表里**：那张表的值是「允许坐什么等级」
        不是金额，塞进 limit_amount（NUMERIC）就得把等级写进别的列，
        又是一列两种语义。它在参照表「交通工具等级标准」里（8 行）。
      concepts:
        - id: C57
          name: 标准类型
          type: string
          enum: EN15
          source: 住宿费限额标准 / 伙食补助费标准 / 市内交通费标准
        - id: C02
          name: 住宿费标准档位
          type: string
          enum: EN21
          source: 附件1《工作人员赴全国各地差旅住宿费标准明细表》表头
          note: |
            317 条里有 105 条的档位在原文件里**就是空的**（表头没有名称），
            入库记成「未命名档」。而且职级→档位的对应关系客户还没给，
            所以住宿费按标准判现在做不了。
        - id: C58
          name: 适用地区
          type: string
          source: 标准明细表的地区列 / 制度条款的「省内·省外」
        - id: C59
          name: 限额金额
          type: number
          source: 标准明细表的金额列（321/321）

    - id: E13
      name: 附件
      source: 客户交付的嵌套 zip（一张单一个内层包）
      rows: 147
      note: |
        共收到 570 个文件，**能挂上单据的 147 个**——另外 402 个属日常费用
        那 53 张单，那批单据没有数据表、挂不上；21 个是同一张单里内容
        完全相同的重复件（按 sha256 去重）。
        类型已定 133 个：72 个由文字层确定性算出、61 个读图判定；
        余 14 个读过但判不出（低把握 / 被一致性闸拦住）。
      concepts:
        - id: C60
          name: 文件名
          type: string
          source: 内层 zip 里的原文件名（147/147）
        - id: C61
          name: 附件类型
          type: string
          enum: EN17
          source: 文字层解析 72 个 / 读图判定 61 个
          note: |
            **来路记在 type_source 里，三种分得开**：文字层解析 / 读图判定 /
            人工指定。读图判的那些要能被挑出来复核，记混了这件事就做不到。
        - id: C62
          name: 内容类型
          type: string
          source: 按扩展名判（PDF 93 / JPG 54）
        - id: C63
          name: 内容指纹
          type: string
          source: sha256（147/147）
          note: 同一张单里内容相同的两份附件靠它去重；库里有唯一约束。

    - id: E18
      name: 业务招待明细
      source: 招待费报账单导出 · 工作表「招待明细区」
      rows: 17
      note: |
        **福建海运集团没有这个实体**，所以从 E18 起编号。
        一次接待一行（不同日期/地点/对象分开填），覆盖 9 张招待单。
        客户 29 条驳回意见里有 4 条就是在查这些。
      concepts:
        - id: C13
          name: 招待金额
          type: number
          source: 招待明细区「招待金额」（17/17）
        - id: C14
          name: 招待类型
          type: string
          source: 招待明细区「招待类型」（17/17）
          note: |
            **系统码，原样存不翻译**：OTHER_ENTERTAIN / BUSINESS_ENTERTAIN。
            客户没给码表。猜错了整类判定全错，而且错得看起来很合理。
            **故意不给它配枚举**：枚举装的是业务上看得懂的取值。
        - id: C15
          name: 招待方式
          type: string
          source: 招待明细区「招待方式」（17/17）
          note: |
            系统码 EAT_WORK / EAT_OUT。实测 EAT_WORK 11 行人均恰好 28.00 元、
            EAT_OUT 6 行人均 178~764 元，看着像「工作餐 / 外出宴请」，
            但**这是观察不是码表**。
        - id: C16
          name: 陪同级别
          type: string
          source: 招待明细区「陪同级别与招待对象」（17/17）
          note: 系统码 LEVEL_01/02/04/05。同上，不翻译。
        - id: C17
          name: 招待地点
          type: string
          source: 招待明细区「招待地点」（17/17，实测只有福州、厦门）
          note: |
            只到城市。判「场所名与发票开票方是否一致」比不了——
            一边是城市名，一边是公司全名。
        - id: C18
          name: 招待发生日期
          type: date
          source: 招待明细区「发生日期」（17/17，2026-02-02 ~ 2026-08-24）
          note: |
            **本实例目前唯一一个业务发生日期**。报账单只有到月的入账期间。
        - id: C19
          name: 招待人数
          type: number
          source: 招待明细区「招待人数」（17/17）
        - id: C20
          name: 陪同人数
          type: number
          source: 招待明细区「陪同人数」（17/17）
          note: |
            「人均」的分母是招待人数还是招待+陪同，**制度原文没说**。
            实测两种算法在商务那 6 行上差一倍（726.67 对 363.33）。已列进客户清单。
        - id: C21
          name: 领用酒水金额
          type: number
          source: 招待明细区「领用酒水金额」（2/17 有值，都是 0）
          note: |
            15 行空着**没有补成 0**：0 和「没填」在金额上不是一回事，
            补成 0 会让「酒水超标」这类规则对着假数据判通过。
            另外这一列只有金额**没有规格与瓶数**，所以
            「白酒每 500 毫升售价不得超过 500 元」那条判不了。
        # 招待对象名单**故意不建概念**：那一列整列不出明文
        # （外部人员姓名与职务黏连、脱敏闭集合切不出来，见 app/mask.py
        #  的 roster 策略）。立概念会让它看起来是可以拿来判的字段。
        # 规则能用的是「名单里有几个人」，那是从该列算出来的，不是该列本身。

    # ── 以下三个实体是 2026-11-01 补的。补的理由写在这里 ────────────────
    #
    # 本文件的原则是「0 行的表不立实体」（见下面「没建的 8 个」那段）。
    # 这三张表当天从 0 行变成有数据，所以该立了：
    #   approval_record    0 → 8 行（业务接待审批单 PDF 的流转记录）
    #   entertain_approval 0 → 2 行（migration 0057 新建的表）
    #   meeting_notice     0 → 1 行（培训通知正文自报的活动起止）
    #
    # **编号与福建海运集团同表同号**：E12 审批记录、E15 会议培训通知。
    # 不另编号——同一张表在两个实例里是两个号，下游对比两家本体时
    # 会把同一件事当成两件。E19 是新的：业务接待审批单那张表
    # 福建海运集团没有（E18 招待明细也是这样起的号）。
    #
    # 三个都还很薄（8 / 2 / 1 行），**薄的原因写在各自的 note 里**：
    # 29 份业务接待审批单里 26 份是 JPG、8 份会议通知里 7 份是扫描件。
    # 读图那一批做完，这三个实体的行数会涨一个量级。
    - id: E12
      name: 审批记录
      source: 822港航 业务接待审批单 · 流转记录（文字层 2 份 + 读图 2 份）
      rows: 16
      note: |
        一个流转节点一行。**只覆盖 4 张单，而且都是接待类**。
        报账单本身的审批流水客户仍然没给——这两件事别混：
        「审批完成时间」这个输入对接待审批有了，对报账单审批还是没有。
        所以 TR-通用-03（报账单审批时效）仍然判不了。
        表上有三个维度要带齐（migration 0059/0060）：
          flow           哪条流程（NULL = 报账流程，'业务接待审批' = 另一条）
          app_no         哪一份审批单（一张单最多挂过 9 份）
          extracted_from 怎么来的（审批单文字层 / 审批单读图）
        少 flow 这一列，报账流程本体页上「分管领导」的实测次数会被污染；
        少后两列，重跑装载程序会把另一批的成果删掉。
        **读图来的只有日期没有时分秒**：票面流转记录带时间戳，但
        TR-接待-01 的口径本来就是按日期比（计划时间有 3 分钟填报噪声），
        所以提示词只问日期，不编时分秒。
      concepts:
        - id: C64
          name: 审批节点
          type: string
          enum: EN16
          source: 票面流转记录的节点标签（8/8）
        - id: C65
          name: 审批时间
          type: datetime
          source: 票面流转记录里黏在签批人后面的时间戳（8/8）
          note: |
            **精确到秒，但判定时只用到日期。**
            实测 FJPG-BX2606240151 接待时间 17:00、最后审批 17:03:45，
            按时间戳判「先接待后审批」会命中，而人工没驳这张单——
            3 分钟是表单填报噪声，审批单上的接待时间是**计划**时间。
        - id: C66
          name: 审批顺序
          type: number
          source: 按票面出现顺序编号（1..4）
          note: |
            **不按时间戳排序编号。** 节点标签和签批人在票面上是按坐标
            错开的，标签一串、签批一串，各按文档顺序收再配对；
            两串长度不等就整份跳过，不硬凑。凑错一位，
            「分管领导什么时候审的」就挂到了部门负责人头上。

    - id: E15
      name: 会议培训通知
      source: 822港航 附件 · 会议或培训通知（1 份文字层 + 5 份读图）
      rows: 6
      note: |
        8 份通知：1 份有文字层（零成本），7 份扫描件 2026-11-01 读图，
        其中 5 份解出了活动起止。一张报账单一行（UNIQUE(bill_no)），
        同一张单挂两份通知时按字段 COALESCE 并成一行、先到先得。
        文字层那 1 份（闽律通〔2026〕56 号）正文自报
        「定于8 月22 日至28 日……举办」，解出 2026-08-22~2026-08-28——
        而人工驳 FJPG-BX2608311795 的原话是
        「按照培训通知体现出差时间应为8.22-8.28」，**逐字一致**。
        这是 TR-差旅-30「审批单日期范围 vs 附件通知日期」缺了很久的第三方。
        **第三方补上之后反而暴露出口径未定**：申报区间与通知区间不一致
        （实测同一期培训班三个人，一个早一天出发、一个提前两天回），
        算不算违规客户没说过，所以规则只报差异、不下结论。
      concepts:
        - id: C67
          name: 活动起始日期
          type: date
          source: 通知正文「定于X月X日至X日……举办」（1/1）
          note: |
            **解析过三道闸才入库**：起 ≤ 止、跨度 ≤ 31 天、年份取自文号
            〔2026〕。过不了就留 NULL。这个正则只在 1 份文件上验过，
            是个下限不是通用解析器——**宁可取不到，不许取错**：
            取错一个日期会让 TR-差旅-30 对正常单据误报。
        - id: C68
          name: 活动结束日期
          type: date
          source: 同上
        - id: C69
          name: 活动地点
          type: string
          source: 通知正文「……日在<地点>举办」（0/1，这一份取不到）
          note: |
            这一份的地点被 PDF 的页码行（「— 1 —」）截断了，所以留空。
            留空不算错；和出差审批单申报的出差地比一致性要等读图那一批。

    - id: E19
      name: 业务接待审批单
      source: 822港航 附件 · 业务接待审批单（文字层 2 份 + 读图 4 份）
      rows: 6
      note: |
        **福建海运集团没有这个实体**，编号接 E18 之后。
        29 份里 2 份 PDF 有文字层，其余 27 份 2026-11-01 读图读完了
        （27 次调用、0 份漏读），**但只有 4 份建得起行**。
        读完才看清这一桶里装着三种表：
          · OA 打印件——流转记录带时间戳，能判（阳性样本在这里）
          · 手写纸质业务接待审批单——经办人/承办部门/分管领导/主管领导
            **只有签名、没有日期**，票面上就没有审批时间这个信息
          · 简餐审批单（附件3）20 份、纪念品酒水领用申请单（附件6）2 份——
            定类时被归成了业务接待审批单，但连「接待时间」那一格都没有
        所以回写闸是**必须有接待时间才建行**：混进来不会误报，
        但会把「审批单份数」这个对外报的数字做大，
        让「这张单的接待审批已核查」看起来成立。
        **「标准（元/人）」和「预算总额」读图不问**（2026-10-22 用户决策：
        这一轮不抽金额），所以读图来的 4 行这两列是空的。
        这张表单是下面几件事唯一的输入来源：
          TR-接待-01 先审批后接待（审批时间 vs 接待时间）
          TR-通用-04 审批滞后
          人工驳回「酒水请标注出规格」（票面有「赠送纪念品」那一栏）
        实测票面自洽可以当解析对不对的免费判据：
        标准 600 × 人数 10 = 预算总额 6000，600 × 8 = 4800，两份都对上。
      concepts:
        - id: C70
          name: 接待部门
          type: string
          source: 票面「接待部门」（2/2，都是经营发展部）
        - id: C71
          name: 接待类型
          type: string
          source: 票面「接待类型」（2/2，都是商务接待）
          note: |
            **故意不配枚举**：本实例没有接待类型码表（客户未提供），
            配了枚举等于宣称我们有一套权威取值。
            口径同 E18 的 C14（招待类型那三个系统码原样存不翻译）。
        - id: C72
          name: 接待时间
          type: datetime
          source: 票面「接待时间」（2/2）
          note: |
            **这是计划时间不是实际发生时间**，判定时只比到日期。
            理由见 E12 的 C65。
        - id: C73
          name: 用餐标准
          type: number
          source: 票面「用餐安排·标准」（2/2，都是 600.00 元）
        - id: C74
          name: 用餐人数
          type: number
          source: 票面「用餐安排·人数」（2/2，10 人与 8 人）
        - id: C75
          name: 预算总额
          type: number
          source: 票面「预算总额」（2/2，6000.00 与 4800.00）
          note: |
            第一版取到的是空值：票面是「预算总额 元」+ 换行 + 「6,000.00」,
            标签行后面跟的是**单位**不是数值，而「元」不为空，
            于是不去看下一行。空值兜底和「取到了但不是数」是两种情况。
        - id: C76
          name: 赠送纪念品安排
          type: string
          source: 票面「赠送纪念品」（2/2，都填「无」）
          note: |
            TR-接待-16「纪念品人均不超过 500 元」判不了**不是缺数据**，
            是适用集合为空：这两份都填「无」，9 张招待单的费用明细里
            也没有任何纪念品项目（只有「商务接待」6 行、「其他招待」3 行）。
        # 接待对象那一列**故意不建概念**，口径同 E18：
        # 外部人员姓名与职务黏连的自由文本，脱敏闭集合切不出来。
        # 库里有（entertain_approval.guest_roster）但不进 fact。
  enums:
    # EN15 是**领域枚举**：它说的是「标准分哪几类」，两家公司是一样的。
    # 取值与 福建海运集团 一致不是抄来的，是同一件事的同一种分法。
    - id: EN15
      name: 标准类型
      source: 制度
      values:
        - 交通工具等级标准
        - 伙食补助费标准
        - 住宿费限额标准
        - 市内交通费标准

    # ── 2026-11-01 补 EN16：本实例原来**根本没有这个枚举** ───────────────
    #
    # approval_record.node 有外键指到 enum_value_current(EN16)，而 822港航
    # 这边 EN16 一个取值都没有——于是审批流水一行都入不了库，
    # 「审批完成时间」这个输入就一直是缺的，卡着
    #   TR-接待-01 业务接待先审批后接待
    #   TR-通用-03 审批流程时效性
    #   TR-通用-04 异常事项说明充分性（审批滞后）
    #   TR-会议-01 专业委员会前置审议
    # 这四条，而复核结论里写的理由是「客户确实没给审批流水」——
    # **那句话只对报账单的流水成立**；业务接待审批单 PDF 上的流转记录
    # 一直在附件里，只是没有枚举装不进来。
    #
    # 取值**逐字抄自客户自己的业务接待审批单票面**（4 个流转节点标签）：
    #   发起节点 → 部门负责人 → 分管领导 → 主管领导
    # 不是从福建海运集团那 10 个里挑的：那边是报账流程的节点
    # （AI审核/共享审核/总经理/撤回/流程结束…），和这张接待审批单
    # 不是同一条流程。两边都有「部门负责人」「分管领导」是因为
    # 同一个集团同一套 OA 的角色名，不是我对齐过去的。
    #
    # 只收这 4 个：26 份审批单是 JPG 还没读图，读完要是出现别的节点名，
    # 装载程序的枚举对照闸会报缺值——**那时候是来补这里，
    # 不是去放宽外键**。
    - id: EN16
      name: 审批节点
      source: 822港航 业务接待审批单 PDF · 流转记录（2 份有文字层，4 个节点）
      values:
        - 发起节点
        - 部门负责人
        - 分管领导
        - 主管领导

    # ── 2026-10-31 补：EN05/EN06/EN08 也是**领域枚举**，不是我抄过来的 ──
    #
    # 这三个的取值是从 822港航 自己的 15 份「港航本部出差审批流程」PDF 的
    # 文字层里读出来的，读完之后发现**和福建海运集团的 EN05/EN06/EN08
    # 一字不差**。原因不难猜：两家都在福建港口集团下、用同一套 OA、
    # 同一张出差审批单表样。所以这是「同一件事的同一种分法」，
    # 和 EN15 同一个性质，不是把别人的清单搬过来。
    # 判据留在这里：**如果哪天 822港航 的表样改了、取值对不上了，
    # 装载程序的枚举对照闸会报缺值，而不是悄悄按另一家的口径入库。**
    - id: EN05
      name: 用餐情况
      source: 822港航 出差审批单 PDF · 「差旅用餐情况」小表（15 份，29 个日行）
      values:
        - 自行用餐（含免费）
        - 协助安排就餐
        - 按规定接待一餐
    - id: EN06
      name: 用车情况
      source: 822港航 出差审批单 PDF · 「差旅用车情况」小表（15 份，26 个日行）
      values:
        - 自行用车
        - 接待单位协助提供车辆
        - 本单位或其他单位提供车辆
    - id: EN08
      name: 用餐栏次
      source: 822港航 出差审批单 PDF · 「差旅用餐情况」小表的列头
      values:
        - 早
        - 中
        - 晚

    # ── EN17 是**用户 2026-11-01 拍板**用福建海运集团那一套词表的 ──────────
    #
    # 这一条**破了本文件上面那条原则**（「不抄福建海运集团那份清单，
    # 取值是各家自己的数据」），所以单独说清楚为什么，以及代价是什么。
    #
    # 为什么破例：附件类型不是一个纯粹的「客户数据取值」，它和代码里的
    # TYPES 表（细类编码 A01..A15 → EN17 值）是**配套的**，而 TYPES 又对着
    # 「必要附件决策表」。换一套词表，这两张表都得跟着重做——
    # 而 822港航 的必要附件决策表客户还没给。
    # 两家都在福建港口集团下、同一套共享中心报销口径，附件分类大概率一致。
    #
    # 代价（**写出来，不藏着**）：822港航 的本体页面上会列出它自己从来没
    # 出现过的类型（租房合同、安全资金确认表、预算调整审批材料这些）。
    # 实测这一批 147 个附件只用到其中 4 个（出差审批单/差旅费明细表、
    # 交通费报销凭证、住宿费发票、其他差旅费发票）。
    # 客户要是说「我们的附件分类不是这 12 类」，改这里、改 TYPES、
    # 改 app/demo/type_822gh_attachments.py 的 type_of()，三处一起。
    #
    # 【后 4 个是实测逼出来的，2026-11-01 同日补】
    # 上面那段写着「822港航 的接待类附件会落到读图那一批，模型很可能判不出来
    # ——判不出就留空」。**试跑 3 条就证伪了这个乐观假设**：
    # 一张「业务接待审批单」被判成了 `事权审批单`，把握「高」，直接写进了字段。
    # 查证：必要附件决策表 29 行里一次都没提过「事权审批单」，
    # fjhy 的 219 个已定类附件里判成它的是 0 个——A13 在 fjhy 是个**空桶**，
    # 模型拿它当了最近邻。
    # **模型不会主动判不出，它会挑最像的那个然后给高把握**，
    # 而「一个错的类型比空值危险」（attachment_classify 纪律 2）。
    # 待读图的 75 个里 50 个属招待单，不补词表就是 50 个高把握的错类型。
    # 用户 2026-11-01 决策：在 12 个基础上补 822港航 自己有的 4 类。
    # 这 4 类**只能用来「认出来」，还不能用来判「该交没交」**：
    # 必要附件决策表里没有它们的条目，那张表客户还没给。
    - id: EN17
      name: 附件类型
      source: 用户 2026-11-01 决策：沿用福建海运集团 12 类 + 822港航 自有 4 类
      values:
        - 出差审批单/差旅费明细表
        - 交通费报销凭证
        - 住宿费发票
        - 其他差旅费发票
        - 会议或培训通知/报名回执
        - 租车合同或协议
        - 租房合同
        - 安全资金确认表/使用表
        - 部门审核的补贴清单
        - 事权审批单
        - 情况说明
        - 预算调整审批材料
        - 业务接待审批单
        - 业务接待结算单
        - 业务接待清单
        - 酒水领用单

    - id: EN09
      name: 发票类型
      source: 822港航 附件里 53 张电子发票的票面标题（经一次口径映射，见下）
      note: |
        **这一个枚举经过一次口径映射，不是票面原话。**
        票面写的是「电子发票（普通发票）」「电子发票（增值税专用发票）」
        「电子发票（铁路电子客票）」三种，而本枚举用的是税务口径的叫法：
            电子发票（普通发票）      → 数电普票
            电子发票（增值税专用发票）  → 数电专票
            电子发票（铁路电子客票）    → 铁路电子客票
        「数电」= 数字化电子发票 = 全电发票，是同一样东西的规范名。
        映射表写在 app/demo/load_822gh_attachments.py 的 INV_TYPE_MAP 里，
        是一张**明表**，映不上的留空并在报告里列出来——不做模糊匹配兜底，
        兜错了会把专票算成普票，而两者的审核要求不一样。
        取值集合与福建海运集团一致（发票类型是国家口径，不是公司口径），
        但本实例**只实际出现了 3 种**，其余列在这里是为了票据类型变化时
        不用改本体。
      values:
        - 数电普票
        - 数电专票
        - 铁路电子客票
        - 增值税普通发票
        - 增值税专用发票
        - 航空运输电子客票行程单
        - 住宿清单
        - 收据
        - 非增值税类发票

    # ── 以下枚举的取值**全部来自 822港航 自己那 29 张真实单据里实际出现的值** ──
    #
    # 不抄福建海运集团那份清单：枚举号（EN01/EN03/…）是全局固定的
    # （业务表上 *_enum 是 GENERATED ALWAYS AS ('EN03') 这类生成列，
    # 所以编号必须一致），但**取值是各家自己的数据**。
    # 抄过来的后果是：822港航 的页面上列着一堆它从来没出现过的取值，
    # 而真出现了新值反而因为外键被拒——两头都错。
    #
    # 取值重合是事实不是抄袭：两家用的是同一套 OA 的业务字典，
    # 「国内差旅费」「伙食补助费」这些本来就一字不差。
    - id: EN01
      name: 单据类型
      source: 822港航 报账单导出（单据号前缀 FJPG-BX）
      note: |
        **导出表里没有「单据类型」这一列。** 这两个取值是按数据来源定的：
        差旅报账单那份导出 → 差旅费报账单；招待费那份 → 业务招待费报账单。
        不是从单据字段读出来的，所以写在这里而不是假装它有出处。
      values:
        - 差旅费报账单
        - 业务招待费报账单
    - id: EN02
      name: 单据状态
      source: 822港航 报账单导出
      note: |
        这 29 张**全部带驳回原因**，没有一张是通过的。
        「已驳回」是从「驳回原因非空」推出来的，导出表里没有状态列。
      values:
        - 已驳回
    # EN12 是 2026-10-31 补的：装 49 名员工时发现 employee.rank_level 有
    # 枚举外键（rank_enum 是 GENERATED ALWAYS AS ('EN12')），而本实例还没有
    # 这个枚举，员工职级就存不进去。**真实数据逼出来的本体条目**，
    # 不是先设计好的。
    - id: EN12
      name: 职级
      source: 822港航 员工信息导出(2026-10-27) · 「主岗」列，49 人全量
      note: |
        取值是**「主岗」列**的实际值，不是「差旅级别」列。两列是两回事：
          主岗     董事长/副总经理/部门负责人/员工/其他员工 —— 职务，对应本枚举
          差旅级别  **49 人全部是「二级」** —— 差旅待遇等级，本该是定住宿档位的
                   依据，但只有一个取值，区分不出任何人
        所以「职级→住宿档位」这件事不是加个映射就能解决：
        客户给的级别数据本身只有一档，而住宿标准表有三档
        （厅局级 / 其他人员 / 未命名档）。这个矛盾要客户先解释，
        已写进《本体数据需求·客户版》第三节第 2 项。
        **不要擅自把「二级」对到某一档**——猜错了，整类住宿费判定全错，
        而且错得看起来很合理。
      values:
        - 董事长
        - 副总经理
        - 部门负责人
        - 员工
        - 其他员工
    - id: EN03
      name: 业务大类
      source: 822港航 报账单导出 · 主表区/头表区「业务大类」
      values:
        - 国内差旅费
        - 国内差旅费(参加会议/培训产生）
        - 国内差旅费(参加安全相关业务产生）
        - 业务招待费
    - id: EN04
      name: 费用小类
      source: 822港航 报账单导出 · 分摊区/费用分摊区「业务小类」
      note: |
        **「市内交通补贴」与「市内交通费补贴」两个值并存**，原数据如此。
        看着像同一个东西写了两种，但这是客户系统里的实际取值，
        不合并——合并等于替客户改了字典，而对账时会对不上。
      values:
        - 交通费
        - 伙食补助费
        - 住宿费
        - 市内交通补贴
        - 市内交通费补贴
        - 其他招待
        - 商务接待

    # EN21 是**实例特有**的：福建海运集团 分两档（公司领导 / 其他人员），
    # 822港航 的附件1 分三档，名字也不一样。正是这个差别逼出了迁移 0044。
    - id: EN21
      name: 住宿费标准档位
      source: 附件1《工作人员赴全国各地差旅住宿费标准明细表》第 8 行表头
      note: |
        **「未命名档」是如实记录，不是占位符。**
        源文件第 8 行表头只写了两格：E 列「厅局级」、F 列「其他人员」，
        而住宿费标准块跨三列（北京一行是 1100 / 980 / 750），
        **D 列那一档在 xlsx 里就是没有名字的**——不是抽取丢的。
        按省直机关差旅费标准的惯例它大概是「省级及相当职务人员」，
        但文件里没写，所以不替它填。等客户确认之后把这个名字改掉，
        standard_limit 里的 tier 会跟着重建。

        另：**制度原文里没有一条说公司职级怎么对应到这三档。**
        搜过 厅局/部级/班子/职务/级别/正职/副职 七个关键词，539 条条款一条都没有。
        所以 rank_to_tier 是空的，住宿费超标判定会一律转人工并说明原因——
        这是判不了，不是没做。对照 福建海运集团，它有明确的「细则第十二条」。
      values:
        - 未命名档
        - 厅局级
        - 其他人员

  relations:
    # 2026-11-01 建。**每条都标了实测依据**：本体不许宣称库里不成立的事。
    # 基数取实测分布，不取制度上的应然——应然 1..n 而实测 0..n 的，
    # 写 0..n 并把差额说清楚。
    - {from: E01, to: E02, type: 包含, card: "1..n", source: 报账单导出,
       note: 实测 29 张单 → 136 行明细，29/29 张单都有明细}
    - {from: E01, to: E13, type: 需附, card: "1..n", source: 附件包,
       note: 实测 29/29 张单都有附件，共 147 个}
    - {from: E01, to: E09, type: 归属, card: "1..1", source: 本体 meta.entity,
       note: 全实例只有一个核算主体}
    - {from: E01, to: E08, type: 提单, card: "1..1", source: 报账单导出「姓名」,
       note: 实测 29/29 有报账人；其中 2 张的报账人不在员工导出里，用占位工号}
    - {from: E01, to: E05, type: 凭据, card: "0..n", source: 附件里的电子发票,
       note: "实测 20/29 张单有已解析的发票（差旅 18、招待 2）；
              **不是 29/29**——182 张 JPG 票据还没解析"}
    - {from: E01, to: E03, type: 关联, card: "0..1", source: 附件里的出差审批单,
       note: "实测 14/20 张差旅单挂得上审批单；另 6 张的审批单是扫描件或
              认不出。招待单不适用，所以下限是 0"}
    - {from: E01, to: E18, type: 包含, card: "0..n", source: 招待费导出「招待明细区」,
       note: 实测 9 张招待单 → 17 行；差旅单不适用，所以下限是 0}
    - {from: E03, to: E04, type: 回填, card: "1..n", source: 审批单的用餐/用车小表,
       note: 实测 15 份审批单 → 87 个日行（29 个日子 × 早中晚）}
    - {from: E08, to: E09, type: 任职, card: "1..1", source: 员工导出「公司」,
       note: 50 人全部任职于同一核算主体}
    - {from: E02, to: E10, type: 比对, card: "0..n", source: 规则,
       note: "费用明细按费用小类去标准表取限额。**这条关系现在只有住宿费、
              伙食补助费、市内交通费三类标准可比**，交通工具等级在参照表里"}
    - {from: E13, to: E05, type: 佐证, card: "0..n", source: 附件文件名与发票号,
       note: "实测 53 个附件的文件名里带已解析的发票号，一一对应。
              这条关系是**算出来的**，库里没有外键"}

  # 职级 → 住宿费档位。**空着是结论，不是待办。** 理由见上面 EN21 的注释。
  rank_to_tier: []

rule_schema:

  note: |
    规则本体：一条规则长什么样。
    **elements 与 classes 是系统的规则元模型，和福建海运集团那份一致**——
    它描述的是「规则由哪几个要素构成」「硬/混合/软各自怎么执行」，
    不是某一家的制度内容，所以相同不是抄袭。
    **dimensions 是本实例特有的**，见下面的说明。
    刻意不含 configurator_alignment：那一段是对齐福建海运集团客户现有配置器的
    字段口径，822港航 没有等价物，凭空放一份进来等于声称对齐过。

  elements:
    - field: rule_id
      name: 规则标识
      required: true
      note: 本系统主键。格式 TR-<制度域>-<两位序号>，TR = Travel（沿用既有前缀）
    - field: name
      name: 规则名称
      required: true
    - field: dimension
      name: 审核维度
      required: true
      enum: dimensions
    - field: risk_class
      name: 风险类别
      required: true
      note: |
        **「类别」不是「等级」。** AI 草稿给的是严重度（高/中/低），
        那是另一回事；当前 74 条一律标「未分类」，等人工归类。
    - field: source_clause
      name: 来源条款
      required: true
      note: 必须含「文件名 + 条款号 + 原文摘录」三件。只写文件名不算。
    - field: scope
      name: 适用范围
      required: true
    - field: logic
      name: 判定逻辑
      required: true
      note: |
        硬规则给表达式；软规则给提示词要点。
        当前 74 条存的都是**自然语言**判定逻辑（AI 抽取草稿），
        compiled=false，发布闸会把它们挡在生效版本之外。
    - field: exception
      name: 例外情形
      required: false
    - field: priority
      name: 优先级
      required: true
      note: |
        数值越小越先判。当前 74 条是默认值（禁止 30 / 警告 50），
        **未经人工排序**——福建海运集团那套 5~100 是人排出来的，造不出来。

  # **按制度域分，不沿用福建海运集团的 D1~D10。**
  # 822港航 的 79 条可成规则草稿里只有 30 条是差旅费的，另外 49 条来自
  # 业务接待(20)/会议(12)/采购(7)/三重一大(3)/备用金(3)/日常费用(2)/租房(2)。
  # D1~D10 是照着「只做差旅报销单」那个范围设计的纯差旅维度，装不下这些；
  # 硬塞只能全进 D10，等于没分类。而维度是落地对账与规则分组的依据。
  # 以制度域分还有一个好处：**它由来源文件直接决定，不需要判断也就不会判错。**
  dimensions:
    - id: 差旅
      name: 差旅费
      note: 《差旅费管理办法》2026〕3号 / 2023〕21号 及附件
    - id: 接待
      name: 业务接待
      note: 《业务接待管理办法》闽港发办〔2023〕6号
    - id: 会议
      name: 会议费
      note: 《会议管理办法》闽港发办〔2024〕17号
    - id: 采购
      name: 物资与服务采购
      note: 《一般物资（服务）采购管理办法》闽港发办〔2024〕19号
    - id: 决策
      name: 三重一大决策
      note: 《“三重一大”决策制度实施办法》闽港发党〔2025〕29号
    - id: 备用金
      name: 备用金
      note: 《备用金管理办法》闽港发资财〔2024〕29号
    - id: 日常
      name: 日常费用报销
      note: 《日常费用报销管理办法》闽港发资财〔2023〕26号
    - id: 租房
      name: 员工租房补贴
      note: 《员工租房补贴管理办法》闽港发办〔2024〕14号
    # 第 9 个维度和前 8 个**不是一回事**，加在最后并单独说明，别当成漏了一份制度。
    - id: 通用
      name: 通用填报与流程规范
      note: |
        **这一维度没有对应的制度文件**，别去找。
        它的来源是共享审核岗 2026 年的 29 条真实人工驳回意见。
        为什么必须单列：把 29 条驳回理由和那 74 条制度规则对过一遍，
        9 类驳回理由里有 5 类在 74 条里**完全没有对应规则**——
        制度写的是实体规范（超标准/超范围/票据要素），
        审核岗实际在拦的是填报规范（入账期间填错、附件不全、
        审批单未体现用车用餐、前后不一致、审批滞后、代报未授权）。
        这两件事不重合，所以不能塞进任何一个制度域；
        而「入账期间填错」这类问题跨所有单据类型，塞进差旅或日常都是错的。
        这一维度下的规则，source_clause 记的是驳回意见而不是条款号。

  classes:
    - id: hard
      name: 硬规则
      exec: 规则引擎直接计算
      output: 通过/不通过
      note: |
        阈值必须有确认过的来源。来自读图/OCR 未复核的阈值**不得编译成硬规则**，
        降级为「待人工」——宁可不判，不可错判。
    - id: mixed
      name: 混合规则
      exec: 硬条件过滤 + 模型判断
      output: 命中硬条件后给风险提示
    - id: soft
      name: 软规则
      exec: 本体约束下的大模型辅助
      output: 标注为「建议」附理由，必须人工复核

process:
  note: |
    **节点与迁移全部出自《附件6：审批流程收集确认表》的「港航公司审批流程
    收集表」，客户已填好。** 不是设计出来的，也不是从审批流水推的——
    这个实例一条审批流水都没有（approval_record 0 行）。

    这一节原来写的是「要建流程本体，缺的是数据，得先让客户给」。
    **那句话是错的**：附件6 是一份**已填好**的确认表，一直在材料目录里。
    缺的是审批**流水**（谁在什么时间审的），那个确实要客户给，
    用来判「审批是否滞后」「是否跳节点」这类规则；
    而流程**本身**长什么样，材料里有。

    口径：
      · 节点 = 确认表的角色列，顺序照表的列序。
      · 「提单」这个节点**表里没有**，是从 29 张单据都有报账人推出来的。
        标 inferred: true，别和表里有的混在一起。
      · 迁移按 (from, to, 分支条件) 去重；模板清单放 note。
        12 个模板 17 个分支逐条展开是 93 条边、去重后 56 条——
        10 个节点之间 93 条边图上没法看，而真正有信息量的是
        「什么条件下多走一个节点」，那个在 cond 里。
      · 确认表的「业财审核」列填的是一个具体的人，不是角色。
        本体里只记工号，人名不写进仓库文件。

    一处要客户确认的冲突：4.2 表里模板序号 7 写的名字是
    「通用仅财务负责人及共享审核流程」，而港航表同一序号是
    「资产入账审核流程」。两者的节点串看起来是同一条
    （经办部门负责人→财务分管领导→共享审核），但名字对不上，
    按序号装载，名字冲突记在这里，**不自己挑一个**。

  nodes:
    - id: P01
      name: 提单
      inferred: true
      source: 由 29 张报账单都有报账人推出（附件6 里没有这个节点）
      note: |
        **推出来的，不是表里有的。** 一条审批链总得有个起点，
        而 29 张单的「姓名」列就是报账人。标出来是为了让
        「这个节点哪来的」查得到，不要以为确认表里写了。
    - id: P02
      name: 业财审核
      source: 附件6《审批流程收集确认表》· 港航公司审批流程收集表「业财审核」列
      action: 由指定人承担（员工工号 2001467）
    - id: P03
      name: 经办部门负责人
      source: 附件6《审批流程收集确认表》· 港航公司审批流程收集表「经办部门负责人」列
      action: R审批
    - id: P04
      name: 归口部门负责人
      source: 附件6《审批流程收集确认表》· 港航公司审批流程收集表「归口部门负责人」列
      action: （确认表这一列 17 个分支全部留空）
      note: |
        **集团 4.1-1 模板里有这个角色，而港航这张表一个分支都没用它。**
        建成节点是为了把这件事记下来：到底是本公司真的不走这个节点，
        还是填表时漏了？要问一句。没有迁移连到它，不影响现在的图。
    - id: P05
      name: 分管领导
      source: 附件6《审批流程收集确认表》· 港航公司审批流程收集表「分管领导」列
      action: R审批
    - id: P06
      name: 财务分管领导
      source: 附件6《审批流程收集确认表》· 港航公司审批流程收集表「财务分管领导」列
      action: R审批
    - id: P07
      name: 总经理
      source: 附件6《审批流程收集确认表》· 港航公司审批流程收集表「总经理」列
